name: Diagnostic des accès (présence des secrets, jamais leur valeur)
on:
  push:
    branches: [import-data]
    paths: [.github/workflows/diag-secrets.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: import-data }
      - env:
          A: ${{ secrets.NEON_API_KEY }}
          B: ${{ secrets.DATABASE_URL }}
          C: ${{ secrets.DALIL_DATABASE_URL }}
          D: ${{ secrets.VERCEL_TOKEN }}
          E: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          F: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          G: ${{ secrets.NEON_PROJECT_ID }}
          H: ${{ vars.NEON_PROJECT_ID }}
        run: |
          mkdir -p data/diag
          { for v in A:NEON_API_KEY B:DATABASE_URL C:DALIL_DATABASE_URL D:VERCEL_TOKEN E:BLOB_READ_WRITE_TOKEN F:VERCEL_AUTOMATION_BYPASS_SECRET G:NEON_PROJECT_ID H:vars.NEON_PROJECT_ID; do k=${v%%:*}; n=${v#*:}; if [ -n "${!k}" ]; then echo "$n présent"; else echo "$n absent"; fi; done; } > data/diag/acces.txt
          cat data/diag/acces.txt
          git config user.name "dalil-import"; git config user.email "salam@mydalil.com"
          git add -f data/diag; git commit -m "Diagnostic des accès [skip ci]" || true
          git pull --rebase origin import-data; git push origin HEAD:import-data
