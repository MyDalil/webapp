name: Import des faits (OpenStreetMap + Wikidata)
on:
  workflow_dispatch:
  push:
    branches: [import-data]
    paths: [scripts/import/fetch-facts.mjs]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { ref: import-data, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: git show origin/main:src/modules/annuaire/data/open-places-selected.json > /tmp/open.json
      - run: node scripts/import/fetch-facts.mjs /tmp/open.json
        continue-on-error: true
      - name: Commit des faits
        if: always()
        run: |
          git config user.name "dalil-import"
          git config user.email "salam@mydalil.com"
          git add -f src/modules/annuaire/data/osm-facts.json src/modules/annuaire/data/wikidata-facts.json
          git commit -m "Données : faits des lieux (OSM ODbL, Wikidata CC0) [skip ci]" || echo "rien de nouveau"
          git pull --rebase origin import-data
          git push origin HEAD:import-data
