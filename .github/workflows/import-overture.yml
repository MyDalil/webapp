name: Import des lieux (Overture Maps)
on:
  workflow_dispatch:
  push:
    branches: [import-data]
    paths: [scripts/import/fetch-overture.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: import-data, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install duckdb==1.1.3 pandas
      - run: python scripts/import/fetch-overture.py
      - name: Archive du jeu brut (Vercel Blob)
        if: always()
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          mkdir -p /tmp/blob && cp scripts/import/archive-blob.mjs /tmp/blob/
          (cd /tmp/blob && npm init -y >/dev/null && npm i --silent @vercel/blob@2.3.1)
          [ -f src/modules/annuaire/data/overture-dz.jsonl.gz ] && node /tmp/blob/archive-blob.mjs overture src/modules/annuaire/data/overture-dz.jsonl.gz || true
      - name: Commit des sélections
        if: always()
        run: |
          git config user.name "dalil-import"
          git config user.email "salam@mydalil.com"
          git add -f src/modules/annuaire/data/overture-stats.json src/modules/annuaire/data/overture-mosques.json || true
          git commit -m "Données : lieux Overture Maps (CDLA Permissive 2.0) [skip ci]" || echo "rien de nouveau"
          git pull --rebase origin import-data
          git push origin HEAD:import-data
