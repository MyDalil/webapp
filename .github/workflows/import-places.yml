name: Import des lieux (sources ouvertes)
on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths: [scripts/import/fetch-places.mjs]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: preview }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/import/fetch-places.mjs
      - name: Commit du jeu de données
        run: |
          git config user.name "dalil-import"
          git config user.email "salam@mydalil.com"
          git add src/modules/annuaire/data/open-places.json
          git commit -m "Données : lieux ouverts (Wikidata, Commons) [skip ci]" || echo "rien de nouveau"
          git push origin HEAD:preview
