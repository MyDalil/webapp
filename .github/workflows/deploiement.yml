name: Contrôle du déploiement
# Après chaque déploiement Vercel réussi (preview ou production) : parcours en lecture seule sur l’adresse déployée.
# Statut « Contrôle du déploiement » à rendre obligatoire avant la fusion preview → main.
# Secret à créer dans GitHub : VERCEL_AUTOMATION_BYPASS_SECRET (Vercel › Settings › Deployment Protection › Protection Bypass for Automation).
on:
  deployment_status:
permissions:
  contents: read
jobs:
  controle:
    name: Parcours sur le déploiement
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Production : le domaine public (l’adresse technique du déploiement exige une connexion Vercel).
      E2E_BASE_URL: ${{ github.event.deployment.environment == 'Production' && 'https://www.mydalil.com' || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_EXPECT_PRODUCTION: ${{ github.event.deployment.environment == 'Production' && '1' || '' }}
    steps:
      - name: Déploiement protégé sans secret de contournement
        id: acces
        run: |
          if [ "$E2E_EXPECT_PRODUCTION" != "1" ] && [ -z "$VERCEL_BYPASS" ]; then
            echo "::notice::Preview protégée par la connexion Vercel et secret VERCEL_AUTOMATION_BYPASS_SECRET absent : contrôle couvert par la CI (build + parcours sur base neuve) et le statut Vercel ; contrôle complet en production."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.acces.outputs.skip != '1'
        uses: actions/checkout@v5
        with: { ref: '${{ github.event.deployment.sha }}' }
      - if: steps.acces.outputs.skip != '1'
        uses: pnpm/action-setup@v4
      - if: steps.acces.outputs.skip != '1'
        uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - if: steps.acces.outputs.skip != '1'
        run: pnpm install --frozen-lockfile
      - if: steps.acces.outputs.skip != '1'
        run: pnpm exec playwright install --with-deps chromium
      - name: Parcours en lecture seule
        if: steps.acces.outputs.skip != '1'
        run: pnpm test:e2e --grep-invert @ecriture
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: rapport-deploiement, path: playwright-report, retention-days: 7 }
