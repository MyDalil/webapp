name: Surveillance du site
# Toutes les heures (actif depuis `main`) : accueil, état application + base (/api/sante, JSON validé strictement), plan du site.
# Panne confirmée (2 essais) → issue « Site indisponible » (GitHub prévient par email) ; retour à la normale → issue commentée et fermée.
# Une nouvelle panne après fermeture ouvre une nouvelle issue (donc un nouvel email).
# Tâche quotidienne : sauvegarde complète vieille de plus de 36 h → issue distincte « Tâche quotidienne en retard ».
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: surveillance
jobs:
  verifier:
    name: Disponibilité de www.mydalil.com
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://www.mydalil.com
      GH_TOKEN: ${{ github.token }}
      TITLE: 'Site indisponible : www.mydalil.com'
    steps:
      - name: Vérifier
        id: check
        run: |
          probe() { curl -s -o /tmp/body -w '%{http_code} %{time_total}' --max-time 20 "$1"; }
          fail=""
          for path in / /api/sante /sitemap.xml; do
            for attempt in 1 2; do
              res=$(probe "$SITE$path"); code=${res%% *}; time=${res##* }
              if [ "$path" = /api/sante ] && [ "$code" = 200 ]; then
                jq -e '.ok == true and .base == "ok"' /tmp/body >/dev/null 2>&1 || code=503
                jq -e '.taches.ok == true' /tmp/body >/dev/null 2>&1 && echo "taches=ok" >> "$GITHUB_OUTPUT" || echo "taches=$(jq -c '.taches // "absent"' /tmp/body 2>/dev/null || echo illisible)" >> "$GITHUB_OUTPUT"
              fi
              [ "$code" = 200 ] && break
              sleep 20
            done
            echo "$path → $code (${time}s)"
            [ "$code" = 200 ] || fail="$fail $path=$code"
          done
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
      - name: Ouvrir ou mettre à jour l’alerte
        if: steps.check.outputs.fail != ''
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')
          msg="Échec à $(date -u '+%Y-%m-%d %H:%M') UTC :${{ steps.check.outputs.fail }}. Journal : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" -b "$msg"; else gh issue create -R "$GITHUB_REPOSITORY" -t "$TITLE" -b "$msg"; fi
          exit 1
      - name: Fermer l’alerte au retour à la normale
        if: steps.check.outputs.fail == ''
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')
          [ -z "$n" ] || gh issue close "$n" -R "$GITHUB_REPOSITORY" -c "Site de nouveau disponible à $(date -u '+%Y-%m-%d %H:%M') UTC."
      - name: Alerte tâche quotidienne
        if: steps.check.outputs.fail == '' && steps.check.outputs.taches != 'ok'
        env:
          TASK_TITLE: 'Tâche quotidienne en retard : sauvegarde de www.mydalil.com'
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TASK_TITLE\" in:title" --json number -q '.[0].number')
          msg="Dernière sauvegarde complète trop ancienne ou absente : ${{ steps.check.outputs.taches }}. Voir /admin › Pilotage › Tâches planifiées."
          [ -n "$n" ] || gh issue create -R "$GITHUB_REPOSITORY" -t "$TASK_TITLE" -b "$msg"
      - name: Fermer l’alerte tâche quotidienne
        if: steps.check.outputs.taches == 'ok'
        env:
          TASK_TITLE: 'Tâche quotidienne en retard : sauvegarde de www.mydalil.com'
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TASK_TITLE\" in:title" --json number -q '.[0].number')
          [ -z "$n" ] || gh issue close "$n" -R "$GITHUB_REPOSITORY" -c "Sauvegarde de nouveau à jour."
